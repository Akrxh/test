<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Frienzo</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#050505;
    --white:#fff;
    --muted:rgba(255,255,255,.48);
    --glass:rgba(255,255,255,.065);
    --glass2:rgba(255,255,255,.095);
    --border:rgba(255,255,255,.13);
    --green:#55ff91;
    --yellow:#ffd84d;
    --red:#ff5365;
}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at 50% -15%,#292929 0,#0c0c0c 32%,#050505 72%);
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "SF Pro Text",Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
}

button,input{
    font:inherit;
}

.app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    margin:auto;
    padding:20px 17px 35px;
}

.glass{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.035)
        );
    border:1px solid var(--border);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 25px 70px rgba(0,0,0,.4);
    backdrop-filter:blur(30px) saturate(130%);
    -webkit-backdrop-filter:blur(30px) saturate(130%);
}

/* HEADER */

.header{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo{
    width:39px;
    height:39px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.15);
    font-size:18px;
    font-weight:800;
}

.brand-name{
    font-size:21px;
    font-weight:700;
    letter-spacing:-.7px;
}

.connection{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:30px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);
    color:var(--muted);
    font-size:11px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--yellow);
}

.connection.online .dot{
    background:var(--green);
    box-shadow:0 0 10px rgba(85,255,145,.6);
}

.connection.offline .dot{
    background:var(--red);
}

/* LOGIN */

.login{
    min-height:calc(100vh - 110px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-bottom:70px;
}

.hero-title{
    margin:0;
    font-size:clamp(48px,13vw,70px);
    line-height:.9;
    letter-spacing:-4px;
    font-weight:800;
}

.hero-subtitle{
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
    max-width:390px;
    margin:18px 0 30px;
}

.login-card{
    padding:21px;
    border-radius:28px;
}

.label{
    display:block;
    margin:0 0 9px 4px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.5px;
}

.code{
    width:100%;
    height:61px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.13);
    outline:none;
    background:rgba(0,0,0,.38);
    color:white;
    text-align:center;
    letter-spacing:9px;
    font-size:25px;
    font-weight:700;
}

.code:focus{
    border-color:rgba(255,255,255,.4);
    box-shadow:0 0 0 4px rgba(255,255,255,.045);
}

.primary{
    width:100%;
    height:57px;
    margin-top:14px;
    border:0;
    border-radius:17px;
    background:white;
    color:black;
    font-weight:700;
    cursor:pointer;
}

.primary:active{
    transform:scale(.985);
}

.error{
    min-height:18px;
    margin:10px 3px 0;
    color:#ff6271;
    font-size:12px;
}

/* DASHBOARD */

#dashboard{
    display:none;
}

.welcome{
    margin:15px 0 22px;
}

.small{
    color:var(--muted);
    font-size:13px;
    margin-bottom:5px;
}

.name{
    font-size:35px;
    line-height:1;
    letter-spacing:-1.7px;
    font-weight:780;
}

.status-card{
    padding:22px;
    border-radius:28px;
    margin-bottom:13px;
}

.status-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.status-label{
    color:var(--muted);
    font-size:11px;
}

.pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:50px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    font-size:11px;
    font-weight:600;
}

.pill-dot{
    width:7px;
    height:7px;
    border-radius:50%;
}

.going .pill-dot{
    background:var(--green);
}

.pending .pill-dot{
    background:var(--yellow);
}

.out .pill-dot{
    background:var(--red);
}

.status-value{
    margin-top:24px;
    font-size:43px;
    letter-spacing:-2px;
    font-weight:800;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.info{
    padding:19px;
    border-radius:23px;
}

.info-label{
    color:var(--muted);
    font-size:10px;
    margin-bottom:9px;
}

.info-value{
    font-size:18px;
    font-weight:650;
    word-break:break-word;
}

.sync{
    margin-top:13px;
    padding:16px 18px;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.sync-title{
    font-size:13px;
    font-weight:600;
}

.sync-time{
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
}

.sync-icon{
    width:35px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:rgba(255,255,255,.07);
}

.logout{
    width:100%;
    height:51px;
    margin-top:23px;
    border-radius:17px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.045);
    color:rgba(255,255,255,.72);
    cursor:pointer;
}

.footer{
    text-align:center;
    color:rgba(255,255,255,.22);
    font-size:9px;
    letter-spacing:.6px;
    margin-top:27px;
}

@media(max-width:390px){
    .app{
        padding-left:14px;
        padding-right:14px;
    }

    .name{
        font-size:31px;
    }

    .status-value{
        font-size:38px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">
            <div class="logo">F</div>
            <div class="brand-name">Frienzo</div>
        </div>

        <div id="connection" class="connection">
            <span class="dot"></span>
            <span id="connectionText">Connecting</span>
        </div>

    </header>


    <!-- LOGIN -->

    <section id="login" class="login">

        <h1 class="hero-title">Welcome.</h1>

        <p class="hero-subtitle">
            Enter your unique Frienzo code to access your account.
        </p>

        <div class="login-card glass">

            <label class="label">
                UNIQUE CODE
            </label>

            <input
                id="codeInput"
                class="code"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="••••••"
                autocomplete="off"
            >

            <button id="loginBtn" class="primary">
                Continue
            </button>

            <div id="error" class="error"></div>

        </div>

    </section>


    <!-- DASHBOARD -->

    <main id="dashboard">

        <div class="welcome">
            <div class="small">Welcome back</div>
            <div id="studentName" class="name">—</div>
        </div>


        <section class="status-card glass">

            <div class="status-head">

                <div class="status-label">
                    CURRENT STATUS
                </div>

                <div id="statusPill" class="pill pending">

                    <span class="pill-dot"></span>
                    <span id="statusPillText">Pending</span>

                </div>

            </div>

            <div id="statusValue" class="status-value">
                Pending
            </div>

        </section>


        <section class="grid">

            <div class="info glass">
                <div class="info-label">CYCLE</div>
                <div id="cycle" class="info-value">—</div>
            </div>

            <div class="info glass">
                <div class="info-label">ACCOUNT</div>
                <div class="info-value">Active</div>
            </div>

        </section>


        <section class="sync glass">

            <div>
                <div class="sync-title">Synchronization</div>
                <div id="syncTime" class="sync-time">
                    Connecting to server…
                </div>
            </div>

            <div class="sync-icon">↻</div>

        </section>


        <button id="logout" class="logout">
            Sign out
        </button>

        <div class="footer">
            FRIENZO • PRIVATE STUDENT NETWORK
        </div>

    </main>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =====================================================
   PUT YOUR FIREBASE CONFIG HERE
   ===================================================== */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    databaseURL:
        "https://YOUR_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_SENDER_ID",

    appId:
        "YOUR_APP_ID"
};


/* =====================================================
   FIREBASE
   ===================================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =====================================================
   ELEMENTS
   ===================================================== */

const login =
    document.getElementById("login");

const dashboard =
    document.getElementById("dashboard");

const codeInput =
    document.getElementById("codeInput");

const loginBtn =
    document.getElementById("loginBtn");

const error =
    document.getElementById("error");

const connection =
    document.getElementById("connection");

const connectionText =
    document.getElementById("connectionText");

const studentName =
    document.getElementById("studentName");

const statusPill =
    document.getElementById("statusPill");

const statusPillText =
    document.getElementById("statusPillText");

const statusValue =
    document.getElementById("statusValue");

const cycle =
    document.getElementById("cycle");

const syncTime =
    document.getElementById("syncTime");


/* =====================================================
   CONNECTION
   ===================================================== */

function connectionState(state){

    connection.classList.remove(
        "online",
        "offline"
    );

    if(state === "online"){

        connection.classList.add("online");
        connectionText.textContent = "Online";

    }else if(state === "offline"){

        connection.classList.add("offline");
        connectionText.textContent = "Offline";

    }else{

        connectionText.textContent = "Connecting";

    }
}


window.addEventListener("online",()=>{
    connectionState("online");
});

window.addEventListener("offline",()=>{
    connectionState("offline");
});


/* =====================================================
   CACHE
   ===================================================== */

function saveSession(code,id){

    localStorage.setItem(
        "frienzo_session",
        JSON.stringify({
            code:code,
            id:id
        })
    );
}

function getSession(){

    try{
        return JSON.parse(
            localStorage.getItem("frienzo_session")
        );
    }catch{
        return null;
    }
}

function saveCache(data){

    localStorage.setItem(
        "frienzo_cache",
        JSON.stringify(data)
    );
}

function getCache(){

    try{
        return JSON.parse(
            localStorage.getItem("frienzo_cache")
        );
    }catch{
        return null;
    }
}


/* =====================================================
   RENDER
   ===================================================== */

function render(data){

    if(!data) return;

    studentName.textContent =
        data.name || "Unknown";

    cycle.textContent =
        data.cycle || "—";

    const status =
        data.status || "pending";

    statusPill.className =
        "pill " + status;

    if(status === "going"){

        statusPillText.textContent = "Going";
        statusValue.textContent = "Going";

    }else if(status === "out"){

        statusPillText.textContent = "Out";
        statusValue.textContent = "Out";

    }else{

        statusPillText.textContent = "Pending";
        statusValue.textContent = "Pending";

    }

    syncTime.textContent =
        "Synced just now";

}


/* =====================================================
   LOAD STUDENT
   ===================================================== */

function watchStudent(id){

    const studentRef =
        ref(db,"students/"+id);

    onValue(
        studentRef,

        snapshot=>{

            connectionState("online");

            if(!snapshot.exists()){

                error.textContent =
                    "This account no longer exists.";

                return;
            }

            const data =
                snapshot.val();

            saveCache(data);
            render(data);

            syncTime.textContent =
                "Live • Updated just now";

        },

        ()=>{
            connectionState("offline");

            syncTime.textContent =
                "Offline • using saved data";
        }
    );
}


/* =====================================================
   LOGIN
   ===================================================== */

async function loginUser(){

    error.textContent = "";

    const code =
        codeInput.value.trim();

    if(!/^[0-9]{6}$/.test(code)){

        error.textContent =
            "Enter your 6-digit code.";

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Checking…";

    try{

        const codeRef =
            ref(db,"codes/"+code);

        const snapshot =
            await get(codeRef);

        if(!snapshot.exists()){

            error.textContent =
                "Invalid code.";

            return;
        }

        const id =
            snapshot.val();

        if(typeof id !== "string"){

            error.textContent =
                "Invalid account.";

            return;
        }

        saveSession(code,id);

        const studentRef =
            ref(db,"students/"+id);

        const studentSnapshot =
            await get(studentRef);

        if(!studentSnapshot.exists()){

            error.textContent =
                "Student account not found.";

            return;
        }

        const data =
            studentSnapshot.val();

        saveCache(data);
        render(data);

        login.style.display = "none";
        dashboard.style.display = "block";

        connectionState("online");

        watchStudent(id);

    }catch(err){

        console.error(err);

        connectionState("offline");

        const cached =
            getCache();

        if(cached){

            render(cached);

            login.style.display = "none";
            dashboard.style.display = "block";

            syncTime.textContent =
                "Offline • cached data";

        }else{

            error.textContent =
                "Unable to connect to Firebase.";

        }

    }finally{

        loginBtn.disabled = false;
        loginBtn.textContent = "Continue";

    }
}


/* =====================================================
   RESTORE SESSION
   ===================================================== */

async function restoreSession(){

    const session =
        getSession();

    if(!session || !session.id)
        return;

    try{

        const studentRef =
            ref(db,"students/"+session.id);

        const snapshot =
            await get(studentRef);

        if(snapshot.exists()){

            const data =
                snapshot.val();

            saveCache(data);
            render(data);

            login.style.display = "none";
            dashboard.style.display = "block";

            connectionState("online");

            watchStudent(session.id);

        }

    }catch{

        const cached =
            getCache();

        if(cached){

            render(cached);

            login.style.display = "none";
            dashboard.style.display = "block";

            connectionState("offline");

            syncTime.textContent =
                "Offline • cached data";
        }
    }
}


/* =====================================================
   EVENTS
   ===================================================== */

loginBtn.addEventListener(
    "click",
    loginUser
);

codeInput.addEventListener(
    "keydown",
    e=>{
        if(e.key === "Enter")
            loginUser();
    }
);

document
.getElementById("logout")
.addEventListener(
    "click",
    ()=>{

        localStorage.removeItem(
            "frienzo_session"
        );

        localStorage.removeItem(
            "frienzo_cache"
        );

        dashboard.style.display =
            "none";

        login.style.display =
            "flex";

        codeInput.value = "";
        error.textContent = "";

    }
);


/* =====================================================
   START
   ===================================================== */

connectionState(
    navigator.onLine
        ? "connecting"
        : "offline"
);

restoreSession();

</script>

</body>
</html>
