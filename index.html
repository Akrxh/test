<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frienzo</title>

<style>
:root{
  --bg:#08090d;
  --panel:#11131a;
  --panel2:#171a23;
  --line:#292e3a;
  --text:#f4f6fb;
  --muted:#8992a3;
  --accent:#ff365f;
  --accent2:#ff7043;
  --green:#50d890;
  --yellow:#ffc857;
  --red:#ff5570;
  --radius:16px;
}

*{box-sizing:border-box;margin:0}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,54,95,.14),transparent 35%),
    radial-gradient(circle at 100% 100%,rgba(255,112,67,.10),transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth{
  width:100%;
  max-width:390px;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:24px;
  padding:30px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  letter-spacing:.04em;
  margin-bottom:8px;
}

.logo span{
  color:var(--accent);
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:16px 0 7px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

input,select{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line);
  background:#0b0d12;
  color:var(--text);
  border-radius:11px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,54,95,.12);
}

.btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  margin-top:18px;
  color:white;
  font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.error{
  color:var(--red);
  font-size:13px;
  margin-top:12px;
  min-height:18px;
  text-align:center;
}

.connection{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
  font-size:12px;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--yellow);
  margin-right:6px;
}

.dot.online{background:var(--green)}
.dot.offline{background:var(--red)}

.app{
  min-height:100vh;
}

.topbar{
  height:70px;
  border-bottom:1px solid var(--line);
  background:rgba(8,9,13,.88);
  backdrop-filter:blur(14px);
  display:flex;
  align-items:center;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.toplogo{
  font-weight:800;
  font-size:21px;
}

.toplogo span{
  color:var(--accent);
}

.topright{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.role{
  padding:6px 10px;
  border-radius:8px;
  background:var(--panel2);
  color:var(--muted);
  font-size:12px;
}

.logout{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:9px;
  padding:8px 11px;
}

.container{
  width:min(1100px,100%);
  margin:auto;
  padding:24px 18px 60px;
}

.hero{
  margin-bottom:22px;
}

.hero h1{
  font-size:30px;
  margin-bottom:6px;
}

.hero p{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.card{
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:19px;
}

.card h2{
  font-size:16px;
  margin-bottom:15px;
}

.stat{
  font-size:30px;
  font-weight:800;
}

.muted{
  color:var(--muted);
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}

.status.going{
  color:var(--green);
  background:rgba(80,216,144,.10);
}

.status.pending{
  color:var(--yellow);
  background:rgba(255,200,87,.10);
}

.status.out{
  color:var(--red);
  background:rgba(255,85,112,.10);
}

.student{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.student:last-child{
  border-bottom:0;
}

.avatar{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:800;
}

.student-main{
  flex:1;
}

.student-name{
  font-weight:700;
}

.student-cycle{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.small-btn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
}

.small-btn.danger{
  color:var(--red);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 17px;
  z-index:100;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.offline-banner{
  background:#2a171b;
  color:#ff9aaa;
  border-bottom:1px solid #4a252d;
  text-align:center;
  padding:8px;
  font-size:12px;
}

@media(max-width:600px){
  .auth{padding:24px}
  .topbar{padding:0 14px}
  .role{display:none}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen" class="screen">
  <div class="auth">

    <div class="logo">FRI<span>ENZO</span></div>
    <div class="subtitle">Connect using your unique access code</div>

    <label for="code">Access Code</label>
    <input
      id="code"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="Enter your code"
    >

    <button id="loginBtn" class="btn">
      Connect
    </button>

    <div id="loginError" class="error"></div>

    <div class="connection">
      <span id="connectionDot" class="dot"></span>
      <span id="connectionText">Connecting to server...</span>
    </div>

  </div>
</section>


<!-- APP -->
<div id="app" class="app hidden">

  <div id="offlineBanner" class="offline-banner hidden">
    Server unavailable — showing locally cached data.
  </div>

  <header class="topbar">

    <div class="toplogo">
      FRI<span>ENZO</span>
    </div>

    <div class="topright">
      <span id="roleBadge" class="role"></span>
      <button id="logoutBtn" class="logout">Logout</button>
    </div>

  </header>

  <main class="container">

    <section class="hero">
      <h1 id="welcome">Welcome</h1>
      <p id="heroText">Your Frienzo dashboard</p>
    </section>

    <!-- STUDENT -->
    <section id="studentView" class="hidden">

      <div class="grid">

        <div class="card">
          <div class="muted">Name</div>
          <div id="studentName" class="stat">—</div>
        </div>

        <div class="card">
          <div class="muted">Cycle</div>
          <div id="studentCycle" class="stat">—</div>
        </div>

        <div class="card">
          <div class="muted">Current Status</div>
          <div id="studentStatus" style="margin-top:10px">—</div>
        </div>

      </div>

    </section>


    <!-- ADMIN -->
    <section id="adminView" class="hidden">

      <div class="grid">

        <div class="card">
          <div class="muted">Students</div>
          <div id="studentCount" class="stat">0</div>
        </div>

        <div class="card">
          <div class="muted">Going</div>
          <div id="goingCount" class="stat">0</div>
        </div>

        <div class="card">
          <div class="muted">Pending</div>
          <div id="pendingCount" class="stat">0</div>
        </div>

        <div class="card">
          <div class="muted">Out</div>
          <div id="outCount" class="stat">0</div>
        </div>

      </div>

      <div class="card" style="margin-top:16px">

        <h2>Add Account</h2>

        <div class="form-grid">

          <div>
            <label>Name</label>
            <input id="newName" maxlength="24" placeholder="Student name">
          </div>

          <div>
            <label>Unique Code</label>
            <input
              id="newCode"
              inputmode="numeric"
              maxlength="6"
              placeholder="6 digit code"
            >
          </div>

          <div>
            <label>Cycle</label>
            <input id="newCycle" maxlength="10" placeholder="A / B / C">
          </div>

        </div>

        <button id="addBtn" class="btn">
          Add Account
        </button>

      </div>


      <div class="card" style="margin-top:16px">

        <h2>Accounts & Status</h2>

        <div id="studentsList"></div>

      </div>

    </section>

  </main>

</div>


<!-- Firebase -->
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove,
  onValue,
  off
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
   Replace these with YOUR Firebase project's values.
   ========================================================= */

const firebaseConfig = {

  apiKey: "YOUR_FIREBASE_API_KEY",

  authDomain:
    "YOUR_PROJECT.firebaseapp.com",

  databaseURL:
    "https://YOUR_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "YOUR_PROJECT",

  storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_FIREBASE_APP_ID"
};


/* =========================================================
   APP SETTINGS
   ========================================================= */

const ADMIN_CODE = "260885";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let firebaseUser = null;
let currentCode = null;
let currentStudentId = null;
let currentRole = null;
let studentsListener = null;


/* =========================================================
   DOM
   ========================================================= */

const $ = id => document.getElementById(id);

const loginScreen = $("loginScreen");
const appScreen = $("app");

const codeInput = $("code");
const loginBtn = $("loginBtn");
const loginError = $("loginError");

const connectionDot = $("connectionDot");
const connectionText = $("connectionText");

const offlineBanner = $("offlineBanner");

const studentView = $("studentView");
const adminView = $("adminView");


/* =========================================================
   CONNECTION STATUS
   ========================================================= */

function setConnection(online, text){

  connectionDot.classList.toggle("online", online);
  connectionDot.classList.toggle("offline", !online);

  connectionText.textContent = text;

  offlineBanner.classList.toggle(
    "hidden",
    online
  );
}


window.addEventListener("online", () => {

  setConnection(true, "Connected to server");

  if(firebaseUser && currentRole === "admin"){
    loadAdmin();
  }

});

window.addEventListener("offline", () => {

  setConnection(false, "Offline");

});


/* =========================================================
   TOAST
   ========================================================= */

function toast(message){

  const el = document.createElement("div");

  el.className = "toast";
  el.textContent = message;

  document.body.appendChild(el);

  setTimeout(() => el.remove(), 2400);
}


/* =========================================================
   LOCAL CACHE
   ========================================================= */

function cacheSet(key, value){

  try{
    localStorage.setItem(
      key,
      JSON.stringify(value)
    );
  }catch{}
}


function cacheGet(key){

  try{

    const value =
      localStorage.getItem(key);

    return value
      ? JSON.parse(value)
      : null;

  }catch{

    return null;

  }
}


/* =========================================================
   AUTOMATIC FIREBASE AUTHENTICATION
   ========================================================= */

async function ensureFirebaseConnection(){

  setConnection(
    navigator.onLine,
    navigator.onLine
      ? "Connecting to server..."
      : "Offline"
  );

  if(!navigator.onLine){

    const cached =
      cacheGet("frienzo_session");

    if(cached){

      currentCode = cached.code;
      currentRole = cached.role;
      currentStudentId = cached.studentId;

      openApp();

      if(currentRole === "admin"){
        loadAdmin();
      }else{
        loadStudent();
      }

    }

    return;

  }

  try{

    /*
      Firebase anonymous authentication happens
      automatically. The user never sees a
      Firebase login screen.
    */

    if(!auth.currentUser){

      await signInAnonymously(auth);

    }

  }catch(error){

    console.error(error);

    setConnection(
      false,
      "Server connection failed"
    );

    const cached =
      cacheGet("frienzo_session");

    if(cached){

      currentCode = cached.code;
      currentRole = cached.role;
      currentStudentId = cached.studentId;

      openApp();

      if(currentRole === "admin"){
        loadAdmin();
      }else{
        loadStudent();
      }

    }

  }

}


/* =========================================================
   FIREBASE AUTH STATE
   ========================================================= */

onAuthStateChanged(auth, user => {

  if(user){

    firebaseUser = user;

    setConnection(
      navigator.onLine,
      navigator.onLine
        ? "Connected to server"
        : "Offline"
    );

  }

});


/* =========================================================
   LOGIN
   ========================================================= */

loginBtn.addEventListener("click", login);

codeInput.addEventListener("keydown", e => {

  if(e.key === "Enter"){
    login();
  }

});


async function login(){

  loginError.textContent = "";

  const code =
    codeInput.value.trim();

  if(!/^[0-9]{6}$/.test(code)){

    loginError.textContent =
      "Enter a valid 6-digit code.";

    return;

  }


  loginBtn.disabled = true;
  loginBtn.textContent = "Connecting...";


  try{

    /*
      ADMIN

      The admin code is recognized by the
      application. Firebase authentication
      is still required before database access.
    */

    if(code === ADMIN_CODE){

      if(!firebaseUser){

        if(!navigator.onLine){

          cacheSet(
            "frienzo_session",
            {
              code,
              role:"admin",
              studentId:null
            }
          );

          currentCode = code;
          currentRole = "admin";
          currentStudentId = null;

          openApp();
          loadAdmin();

          return;

        }

        await signInAnonymously(auth);

      }

      currentCode = code;
      currentRole = "admin";
      currentStudentId = null;

      cacheSet(
        "frienzo_session",
        {
          code,
          role:"admin",
          studentId:null
        }
      );

      openApp();
      loadAdmin();

      return;

    }


    /*
      STUDENT LOGIN
    */

    if(!firebaseUser){

      if(!navigator.onLine){

        const cached =
          cacheGet("frienzo_session");

        if(cached && cached.code === code){

          currentCode = code;
          currentRole = "student";
          currentStudentId =
            cached.studentId;

          openApp();
          loadStudent();

          return;

        }

        throw new Error(
          "This code has not been cached on this device."
        );

      }

      await signInAnonymously(auth);

    }


    const codeSnap =
      await get(
        ref(db, "codes/" + code)
      );


    if(!codeSnap.exists()){

      throw new Error(
        "Invalid access code."
      );

    }


    const studentId =
      codeSnap.val();


    const studentSnap =
      await get(
        ref(db, "students/" + studentId)
      );


    if(!studentSnap.exists()){

      throw new Error(
        "Account not found."
      );

    }


    currentCode = code;
    currentRole = "student";
    currentStudentId = studentId;


    cacheSet(
      "frienzo_session",
      {
        code,
        role:"student",
        studentId
      }
    );


    openApp();
    loadStudent();


  }catch(error){

    console.error(error);

    loginError.textContent =
      error.message ||
      "Unable to connect.";

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "Connect";

  }

}


/* =========================================================
   OPEN APP
   ========================================================= */

function openApp(){

  loginScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");

  $("roleBadge").textContent =
    currentRole === "admin"
      ? "ADMIN"
      : "STUDENT";

}


/* =========================================================
   STUDENT
   ========================================================= */

async function loadStudent(){

  studentView.classList.remove("hidden");
  adminView.classList.add("hidden");

  $("welcome").textContent =
    "Welcome";

  $("heroText").textContent =
    "Your Frienzo account";


  if(!navigator.onLine){

    const cached =
      cacheGet(
        "frienzo_student_" +
        currentStudentId
      );

    if(cached){

      renderStudent(cached);

    }

    return;

  }


  try{

    const snap =
      await get(
        ref(
          db,
          "students/" +
          currentStudentId
        )
      );


    if(!snap.exists()){

      toast("Account no longer exists.");
      logout();

      return;

    }


    const data = snap.val();

    cacheSet(
      "frienzo_student_" +
      currentStudentId,
      data
    );

    renderStudent(data);


    /*
      Live status updates.
    */

    onValue(
      ref(
        db,
        "students/" +
        currentStudentId
      ),
      snap => {

        if(snap.exists()){

          const data = snap.val();

          cacheSet(
            "frienzo_student_" +
            currentStudentId,
            data
          );

          renderStudent(data);

        }

      }
    );

  }catch(error){

    console.error(error);

    const cached =
      cacheGet(
        "frienzo_student_" +
        currentStudentId
      );

    if(cached){

      renderStudent(cached);

    }

  }

}


function renderStudent(data){

  $("studentName").textContent =
    data.name || "Unknown";

  $("studentCycle").textContent =
    data.cycle || "—";

  $("studentStatus").innerHTML =
    statusHTML(
      data.status
    );

  $("welcome").textContent =
    "Welcome, " +
    (data.name || "Student");

}


function statusHTML(status){

  const names = {
    going:"Going",
    pending:"Pending",
    out:"Out"
  };

  const icons = {
    going:"●",
    pending:"●",
    out:"●"
  };

  const safe =
    names[status]
      ? status
      : "pending";

  return `
    <span class="status ${safe}">
      ${icons[safe]}
      ${names[safe]}
    </span>
  `;

}


/* =========================================================
   ADMIN
   ========================================================= */

async function loadAdmin(){

  studentView.classList.add("hidden");
  adminView.classList.remove("hidden");

  $("welcome").textContent =
    "Admin Dashboard";

  $("heroText").textContent =
    "Manage Frienzo accounts and status";


  if(!navigator.onLine){

    const cached =
      cacheGet("frienzo_students");
